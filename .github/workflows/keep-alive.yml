name: Keep backend warm

# The Render free tier spins the backend down after ~15 minutes of no traffic, and cold-starting
# it back up takes ~40 seconds (measured). Pinging /health every 10 minutes keeps it warm during
# any period of active use, without paying for Render's always-on tier.
#
# GitHub's scheduler is best-effort (a run can be delayed under load, and GitHub disables
# scheduled workflows on repos with no commits for 60+ days) — this reduces cold starts, it
# doesn't guarantee zero. Free on public repos either way.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://music-assistant-backend-ttq5.onrender.com/health
